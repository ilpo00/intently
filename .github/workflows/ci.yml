name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intently
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test, eval, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: intently/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        if: matrix.task == 'typecheck'
        run: npm run typecheck

      - name: Lint
        if: matrix.task == 'lint'
        run: npm run lint

      - name: Test
        if: matrix.task == 'test'
        run: npm run test:ci

      # Keyless quality evals: exclusions honoured, grounding verifier,
      # consultation restraint (see intently/docs/eval-scorecard-latest.md).
      - name: Eval
        if: matrix.task == 'eval'
        run: npm run eval

      - name: Build
        if: matrix.task == 'build'
        run: npm run build

  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "One or more checks failed."
            exit 1
          fi
